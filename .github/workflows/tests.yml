name: tests
# The repository defends its own numbers. Three things run on every push:
#   1. the mathematics is checked against a worked example before it is
#      pointed at any real data;
#   2. the estimator must recover a reliability it was not told, from
#      simulated rows where the answer is known by construction;
#   3. the saved leaderboard must still match the live public page, so the
#      committed JSON is a reproducible claim rather than a copy-paste.
#
# No third-party dependencies. Standard library only.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"      # weekly: catch upstream numbers changing

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Mathematics self-checks
        run: python ceiling_bounds.py --self-test

      - name: Bounds and data integrity (15 tests)
        run: python test_ceiling.py

      - name: Estimator recovery and methodological traps (35 tests)
        run: python test_reliability.py

      - name: Rating store refusals and provenance (11 tests)
        run: python test_store.py

      - name: Reports run end to end
        run: |
          python ceiling_bounds.py > /dev/null
          python chart.py > /dev/null
          python simulate.py > /dev/null
          python simulate.py --departures > /dev/null
          python reliability.py --matrix 0.2504 > /dev/null

      - name: Store round trip from a CSV to a report
        run: |
          python -c "from simulate import make_ratings, write_csv;             rows, _ = make_ratings(n_items=60, k_raters=3, rho_1=0.45, seed=1, crossed=True);             write_csv(rows, 'ci.csv')"
          python store.py --db ci.db ingest ci.csv --rubric v1
          python store.py --db ci.db ingest ci.csv --rubric v1   # idempotent
          python store.py --db ci.db sources
          python store.py --db ci.db analyse > /dev/null

  live-data:
    # Separated: a change in the upstream page is news, not a broken build.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Saved numbers still match the live leaderboard
        run: python fetch_leaderboard.py --check
